name: Job alerts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the job save state/ and applications/ back to the repo

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # drafting a handful of applications can take several minutes
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Check for new jobs and draft applications
        run: python job_alert.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save seen jobs and drafted applications
        if: always()
        run: |
          git config user.name "job-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ applications/ 2>/dev/null || git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Update seen jobs and applications"
            # prefill.py may have updated an application's status in the meantime
            git pull --rebase --quiet && git push
          fi
